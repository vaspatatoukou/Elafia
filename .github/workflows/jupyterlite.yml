name: Deploy JupyterLite to GitHub Pages

# Κάθε φορά που αλλάζει το main (π.χ. ανεβάζεις νέο notebook), το site ξαναχτίζεται.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install JupyterLite
        run: python -m pip install jupyterlite-core jupyterlite-pyodide-kernel jupyter-server

      - name: Collect notebooks
        # Όλα τα .ipynb του φακέλου ανεβαίνουν στο site.
        run: |
          mkdir -p _content
          cp ./*.ipynb _content/

      - name: Build JupyterLite
        run: jupyter lite build --contents _content --output-dir dist

      - name: Redirect the site root to the notebook
        # Προσοχή: ΔΕΝ αντικαθιστούμε το dist/index.html. Το JupyterLite διαβάζει τις
        # ρυθμίσεις του από εκεί. Προσθέτουμε μόνο μια ανακατεύθυνση μέσα στο <head>.
        # Αν αλλάξεις το όνομα του notebook, άλλαξέ το και εδώ.
        run: |
          python - <<'EOF'
          import pathlib, re
          p = pathlib.Path("dist/index.html")
          html = p.read_text(encoding="utf-8")
          redirect = '<meta http-equiv="refresh" content="0; url=notebooks/index.html?path=Elafia_Colab__gia_parousiasi.ipynb">'
          new = re.sub(r"(<head[^>]*>)", lambda m: m.group(1) + redirect, html, count=1, flags=re.I)
          assert new != html, "Δεν βρέθηκε <head> στο dist/index.html"
          assert "jupyter-config-data" in new, "Λείπουν οι ρυθμίσεις του JupyterLite από το dist/index.html"
          p.write_text(new, encoding="utf-8")
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
