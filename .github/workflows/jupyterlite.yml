name: Deploy JupyterLite to GitHub Pages

# Κάθε φορά που αλλάζει το main (π.χ. ανεβάζεις νέο notebook), το site ξαναχτίζεται.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install JupyterLite
        run: python -m pip install jupyterlite-core jupyterlite-pyodide-kernel jupyter-server

      - name: Collect notebooks
        # Όλα τα .ipynb του φακέλου ανεβαίνουν στο site.
        run: |
          mkdir -p _content
          cp ./*.ipynb _content/

      - name: Build JupyterLite
        run: jupyter lite build --contents _content --output-dir dist

      - name: Add landing page
        # Η αρχική σελίδα ανοίγει κατευθείαν το notebook.
        run: cp landing/index.html dist/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
